name: Bug
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
