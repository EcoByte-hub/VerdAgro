name: Tarefa
description: Uma entrega do MVP ou do backlog
labels: []
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que isso importa para a demo ou para o produto?
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: O que precisa ser feito (lista curta)
